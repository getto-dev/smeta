name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  BASE_PATH: /smeta/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate local catalog data
        run: npm run validate:data

      - name: Validate remote catalog data
        run: npm run validate:remote-data

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Vite App
        run: npm run build

      - name: Verify Pages output
        run: |
          test -s dist/index.html
          test -f dist/manifest.webmanifest
          grep -q '/smeta/' dist/manifest.webmanifest
          test -f dist/pwa-192x192.png
          test -f dist/pwa-512x512.png
          test -f dist/pwa-maskable-512x512.png
          test ! -e dist/data/profiles.json
          test ! -e dist/data/profiles/plumbing/catalog.json
          test ! -e dist/data/profiles/electrical/catalog.json
          test ! -e dist/data/profiles/finishing/catalog.json
          test ! -e dist/data/profiles/construction/catalog.json
          if grep -R -n -e 'check-data' -e 'checknew' dist; then
            echo 'Found legacy project/data-source references in build output.'
            exit 1
          fi
          grep -q 'smeta-remote-data-v5' dist/sw.js

      - name: Verify repository has no legacy project/data paths
        run: |
          if git grep -n -e 'checknew' -e 'check-data' -- src package.json vite.config.ts index.html; then
            echo 'Found legacy project or data-source references.'
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application for E2E
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

  deploy:
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
