name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate local catalog data
        run: npm run validate:data

      - name: Validate remote catalog data
        run: npm run validate:remote-data

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /smeta/

      - name: Verify build has no legacy project/data paths
        run: |
          if git grep -n -e 'checknew' -e 'check-data' -- src data scripts README.md DATA_LAYER.md package.json vite.config.ts index.html; then
            echo 'Found legacy project or data-source references.'
            exit 1
          fi
          grep -q '/smeta/' dist/manifest.webmanifest
          if grep -R -n -e 'check-data' -e 'checknew' dist; then
            echo 'Found legacy project/data-source references in build output.'
            exit 1
          fi
          grep -q 'smeta-remote-data-v5' dist/sw.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
